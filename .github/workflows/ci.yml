name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: engine (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Gate a clean account
        run: python -m apsis check --scenario scenarios/ci-cd

      - name: Report the startup fixture
        run: |
          python -m apsis scan --scenario scenarios/startup \
            --markdown apsis-report.md \
            --sarif apsis.sarif \
            --mermaid apsis.mmd \
            --no-color || true

      - uses: actions/upload-artifact@v4
        with:
          name: apsis-report-${{ matrix.python }}
          path: |
            apsis-report.md
            apsis.sarif
            apsis.mmd

  site:
    name: site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run build
      - name: Accessibility gate
        env:
          CHROME_PATH: /usr/bin/google-chrome
          BASE_URL: http://localhost:4180/
        run: |
          npm run preview -- --port 4180 --strictPort &
          for i in {1..30}; do curl -fsS http://localhost:4180/ >/dev/null && break; sleep 1; done
          node scripts/audit.mjs
      - name: Lighthouse gate
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npx --yes @lhci/cli@0.14.0 autorun
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: console/dist

