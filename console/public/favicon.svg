    <path d="M24.4 36.2 H39.6" fill="none" stroke="#ffb26b" stroke-width="2.3" />
  </g>

  <circle cx="52.4" cy="20.2" r="5.6" fill="url(#halo)" />
  <circle cx="52.4" cy="20.2" r="2.4" fill="#fffaf0" />
  <circle cx="52.4" cy="20.2" r="4" fill="none" stroke="#ffd9a8" stroke-opacity=".5" stroke-width=".6" />

  <circle cx="11.8" cy="45.6" r="1.4" fill="#7ce7ff" />
