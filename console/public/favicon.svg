<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Apsis">
  <defs>
    <radialGradient id="sky" cx="34%" cy="22%" r="90%">
      <stop offset="0" stop-color="#10224d" />
      <stop offset="0.52" stop-color="#070d1d" />
      <stop offset="1" stop-color="#05060f" />
    </radialGradient>
    <radialGradient id="sun" cx="42%" cy="36%" r="64%">
      <stop offset="0" stop-color="#fff7e6" />
      <stop offset="0.46" stop-color="#ffe1b0" />
      <stop offset="1" stop-color="#ffc98a" />
    </radialGradient>
    <radialGradient id="live" cx="36%" cy="30%" r="70%">
      <stop offset="0" stop-color="#e4f7ff" />
      <stop offset="1" stop-color="#8fd8ff" />
    </radialGradient>
    <filter id="glow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="2.4" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#sky)" />
  <circle cx="32" cy="32" r="22" fill="none" stroke="#8fd8ff" stroke-opacity="0.06" />

  <g filter="url(#glow)">
    <ellipse cx="32" cy="34" rx="26" ry="9" fill="none" stroke="#ffc98a" stroke-opacity="0.55" stroke-width="1" transform="rotate(-20 32 34)" />
    <ellipse cx="32" cy="32" rx="12" ry="25" fill="none" stroke="#9cc3ff" stroke-opacity="0.8" stroke-width="1.1" transform="rotate(18 32 32)" />
    <circle cx="32" cy="32" r="9.5" fill="url(#sun)" />
    <circle cx="32" cy="32" r="4.3" fill="#fff9ec" fill-opacity="0.92" />
    <circle cx="42" cy="9.5" r="4.8" fill="url(#live)" />
    <circle cx="42" cy="9.5" r="7.6" fill="none" stroke="#8fd8ff" stroke-opacity="0.3" stroke-width="0.9" />
    <circle cx="12.5" cy="44" r="2.6" fill="#eef2ff" fill-opacity="0.8" />
  </g>
</svg>
