  </g>

  <g fill="none" stroke="#f4efe3" stroke-opacity=".4" stroke-width=".9" stroke-linecap="square">
    <path d="M5 11V5h6" />
    <path d="M53 5h6v6" />
    <path d="M59 53v6h-6" />
    <path d="M11 59H5v-6" />
  </g>

  <ellipse cx="32" cy="35" rx="27" ry="10" transform="rotate(-18 32 35)" fill="none" stroke="#ffb26b" stroke-opacity=".16" stroke-width="3.2" />
  <ellipse cx="32" cy="35" rx="27" ry="10" transform="rotate(-18 32 35)" fill="none" stroke="url(#orbit)" stroke-opacity=".85" stroke-width="1.2" />
  <ellipse cx="32" cy="32" rx="20.5" ry="6.6" transform="rotate(30 32 32)" fill="none" stroke="#f4efe3" stroke-opacity=".2" stroke-width=".65" />

  <g transform="rotate(-18 32 33)">
    <ellipse cx="32" cy="33" rx="14.5" ry="4.8" fill="none" stroke="#ffb26b" stroke-opacity=".55" stroke-width="1.5" />
    <ellipse cx="32" cy="33" rx="9.5" ry="3.1" fill="none" stroke="#fffaf0" stroke-opacity=".75" stroke-width=".55" />
  </g>
  <circle cx="32" cy="33" r="6" fill="#040506" stroke="#f4efe3" stroke-opacity=".55" stroke-width=".7" />
  <path d="M26.4 30.6 A6 6 0 0 1 37.6 30.6" fill="none" stroke="#fffaf0" stroke-opacity=".8" stroke-width=".8" />
  <path d="M26.6 35.7 A6 6 0 0 0 37.4 35.7" fill="none" stroke="#7ce7ff" stroke-opacity=".55" stroke-width=".6" />

  <g stroke-linecap="square" stroke-linejoin="miter">
    <path d="M19.2 47.8 L32 12.6 L44.8 47.8" fill="none" stroke="#ffb26b" stroke-opacity=".32" stroke-width="4.5" transform="translate(1 1)" />
    <path d="M18.4 47.4 L32 12 L45.6 47.4" fill="none" stroke="url(#bone)" stroke-width="4.3" filter="url(#soft)" />
  </g>

  <circle cx="52.6" cy="18.6" r="6.2" fill="url(#sun)" />
  <circle cx="52.6" cy="18.6" r="2.1" fill="#fffaf0" />
  <circle cx="11.4" cy="45.2" r="1.6" fill="#7ce7ff" />
  <circle cx="11.4" cy="45.2" r="3.1" fill="none" stroke="#7ce7ff" stroke-opacity=".35" stroke-width=".5" />

  <g stroke="#f4efe3" stroke-opacity=".5" stroke-width=".7" stroke-linecap="square">
