<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Apsis">
  <defs>
    <radialGradient id="tile" cx="38%" cy="24%" r="88%">
      <stop offset="0" stop-color="#1b1c1f" />
      <stop offset="0.55" stop-color="#0b0c0e" />
      <stop offset="1" stop-color="#050607" />
    </radialGradient>
    <linearGradient id="bone" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#fffaf0" />
      <stop offset="0.5" stop-color="#f4efe3" />
      <stop offset="1" stop-color="#cfc7b6" />
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb26b" />
      <stop offset="0.55" stop-color="#e8a06a" />
      <stop offset="1" stop-color="#7ce7ff" />
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd9a8" stop-opacity=".85" />
      <stop offset="0.42" stop-color="#ffb26b" stop-opacity=".32" />
      <stop offset="1" stop-color="#ffb26b" stop-opacity="0" />
    </radialGradient>
    <filter id="soft" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="1.1" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="2" fill="url(#tile)" />
  <rect x="0.7" y="0.7" width="62.6" height="62.6" rx="1.4" fill="none" stroke="#f4efe3" stroke-opacity=".24" />

