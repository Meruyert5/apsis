<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Apsis">
  <defs>
    <radialGradient id="sky" cx="34%" cy="22%" r="90%">
      <stop offset="0" stop-color="#1a1711" />
      <stop offset="0.55" stop-color="#0e0d0a" />
      <stop offset="1" stop-color="#080806" />
    </radialGradient>
    <radialGradient id="sun" cx="42%" cy="36%" r="64%">
      <stop offset="0" stop-color="#f6edd8" />
      <stop offset="0.5" stop-color="#e2c47e" />
      <stop offset="1" stop-color="#d8b25e" />
    </radialGradient>
    <radialGradient id="live" cx="36%" cy="30%" r="70%">
      <stop offset="0" stop-color="#f6f0e2" />
      <stop offset="1" stop-color="#ece6d8" />
    </radialGradient>
    <filter id="glow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="2" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="4" fill="url(#sky)" />
  <rect x="0.5" y="0.5" width="63" height="63" rx="4" fill="none" stroke="#ece6d8" stroke-opacity="0.14" />
  <circle cx="32" cy="32" r="22" fill="none" stroke="#ece6d8" stroke-opacity="0.06" />

  <g filter="url(#glow)">
    <ellipse cx="32" cy="34" rx="26" ry="9" fill="none" stroke="#d8b25e" stroke-opacity="0.6" stroke-width="1" transform="rotate(-20 32 34)" />
    <ellipse cx="32" cy="32" rx="12" ry="25" fill="none" stroke="#ece6d8" stroke-opacity="0.7" stroke-width="1" transform="rotate(18 32 32)" />
    <circle cx="32" cy="32" r="9.5" fill="url(#sun)" />
    <circle cx="32" cy="32" r="4.3" fill="#f8f1e2" fill-opacity="0.92" />
    <circle cx="42" cy="9.5" r="4.6" fill="url(#live)" />
    <circle cx="42" cy="9.5" r="7.4" fill="none" stroke="#ece6d8" stroke-opacity="0.28" stroke-width="0.9" />
    <circle cx="12.5" cy="44" r="2.4" fill="#8ea2ff" fill-opacity="0.8" />
  </g>
</svg>
