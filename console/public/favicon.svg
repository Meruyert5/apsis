  </g>

  <g fill="none" stroke="#f4efe3" stroke-opacity=".42" stroke-width=".9" stroke-linecap="square">
    <path d="M5 11V5h6" />
    <path d="M53 5h6v6" />
    <path d="M59 53v6h-6" />
    <path d="M11 59H5v-6" />
  </g>

  <ellipse cx="32" cy="34" rx="26.5" ry="10" transform="rotate(-18 32 34)" fill="none" stroke="#ffb26b" stroke-opacity=".18" stroke-width="3.2" />
  <ellipse cx="32" cy="34" rx="26.5" ry="10" transform="rotate(-18 32 34)" fill="none" stroke="url(#orbit)" stroke-opacity=".9" stroke-width="1.25" />
  <ellipse cx="32" cy="32.5" rx="21" ry="7" transform="rotate(30 32 32.5)" fill="none" stroke="#f4efe3" stroke-opacity=".24" stroke-width=".7" />

  <g stroke-linecap="square" stroke-linejoin="miter">
    <path d="M19.4 47.6 L32 14.8 L44.6 47.6" fill="none" stroke="#ffb26b" stroke-opacity=".4" stroke-width="4.4" transform="translate(1.1 1)" />
